services:
  dashboard-bnb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard_estudos_bnb
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
      - PORT=80
      - DB_PATH=/app/data/bnb_estudos.sqlite
      - SEED_FILE_PATH=/app/data/initial-workspace.seed.json
      - TOPIC_PROGRESS_BACKUP_FILE=/app/data/topic-progress-backup.json
      - JWT_SECRET=${JWT_SECRET:-}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:-${JWT_SECRET:-}}
      - MONGODB_URI=${MONGODB_URI:-}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL:-}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD:-}
      - DEFAULT_USER_NAME=${DEFAULT_USER_NAME:-}
    volumes:
      - ./data:/app/data
