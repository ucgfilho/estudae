<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="estudaê — Plataforma inteligente de estudos e cronogramas adaptados para qualquer concurso público" />
    <title>estudaê — Sua Plataforma de Estudos para Concursos</title>
    <script>
      // Aplica o tema salvo antes da renderização para evitar flash de tema incorreto.
      (function () {
        try {
          var t = localStorage.getItem('bnb-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
